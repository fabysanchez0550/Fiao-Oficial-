<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | FIA'O</title>
  <meta name="description" content="Entra a tu cuenta de FIA'O.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body data-page="simple">

  <header class="header" id="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">FIA'<span class="logo__o">O</span></a>
      <nav class="nav" id="nav" aria-label="Principal">
        <a href="index.html">Inicio</a>
        <a href="Fiados.html">Fiados</a>
        <a href="Clientes.html">Clientes</a>
        <a href="Productos.html">Productos</a>
        <a href="Reportes.html">Reportes</a>
        <a href="Contacto.html">Contacto</a>
        <div class="nav__actions">
          <a href="Login.html" class="btn btn--ghost">Iniciar sesión</a>
          <a href="Registro.html" class="btn btn--primary">Crear cuenta</a>
        </div>
      </nav>
      <button class="burger" id="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
    </div>
  </header>

  <main>
    <section class="auth">
      <div class="auth__box panel-box">
        <p class="auth__icon"><i class="bi bi-person-check" aria-hidden="true"></i></p>
        <h1 class="h3">Iniciar sesión</h1>
        <p class="auth__intro">Entra para revisar las cuentas de tu negocio.</p>
        <form class="form form--light" id="form" data-auth="login" novalidate>
          <label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="email"><small class="error" data-for="email"></small>
          <label for="password">Contraseña</label>
          <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password"><button class="password-toggle" type="button" data-reveal-field="password" aria-label="Mostrar contraseña"><i class="bi bi-eye" aria-hidden="true"></i></button></div>
          <small class="error" data-for="password"></small>
          <p class="form__error" role="alert" hidden></p>
          <button class="btn btn--primary btn--lg" type="submit"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar</button>
          <p class="form__ok" role="status" hidden>Listo. Entrando a tu panel...</p>
        </form>
        <p>¿No tienes cuenta? <a id="registerLink" href="Registro.html">Crea una</a></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="logo">FIA'<span class="logo__o">O</span></p>
      <p>© 2026 FIA'O. Hecho para los negocios de Panamá.</p>
      <nav aria-label="Legal"><a href="#">Privacidad</a><a href="#">Términos</a><a href="#">Accesibilidad</a></nav>
    </div>
  </footer>

  <script src="Javas/i18n.js"></script>
  <script src="Javas/firebase-config.js"></script>
  <script src="Javas/firebase-loader.js"></script>
  <script src="Javas/script.js"></script>
</body>
</html>
