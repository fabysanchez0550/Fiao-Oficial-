<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Clientes | Panel FIA'O</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="Style/app.css">
</head>
<body class="app" data-page="clientes">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="logo">FIA'<span class="logo__o">O</span></a>
      <nav class="side-nav" id="sideNav" aria-label="Panel"></nav>
      <div class="side-foot">
        <p id="userName"></p>
        <button class="btn btn--ghost btn--sm" id="logout" type="button">Cerrar sesión</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="app-main">
      <header class="topbar">
        <button class="burger" id="menuBtn" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar"><span></span><span></span></button>
        <h1>Clientes</h1>
        <span class="topbar__biz" id="bizName"></span>
      </header>

      <main class="app-content">
        <section class="panel-box">
          <div class="panel-head">
            <div>
              <h2 class="h3">Tu gente de confianza</h2>
              <p class="muted" id="clientCount">0 clientes</p>
              <p class="muted client-storage-note">Las fotos se guardan en este navegador.</p>
            </div>
            <button class="btn btn--primary btn--sm" id="addClient" type="button"><i class="bi bi-person-plus" aria-hidden="true"></i> Agregar cliente</button>
          </div>
          <div class="client-tools">
            <label class="search-wrap"><i class="bi bi-search" aria-hidden="true"></i><input class="search" id="clientSearch" type="search" placeholder="Buscar por nombre o teléfono" aria-label="Buscar por nombre o teléfono"></label>
            <div class="tabs__list client-filters" role="group" aria-label="Filtrar clientes">
              <button class="tab is-active" type="button" data-client-filter="todos" aria-pressed="true">Todos</button>
              <button class="tab" type="button" data-client-filter="pendientes" aria-pressed="false">Con saldo</button>
              <button class="tab" type="button" data-client-filter="aldia" aria-pressed="false">Al día</button>
            </div>
          </div>
          <div id="clientsCarousel" class="client-carousel" role="region" aria-label="Carrusel de clientes" tabindex="0">
            <div class="client-carousel__indicators" id="clientIndicators" role="group" aria-label="Elegir cliente"></div>
            <div class="client-track" id="clientList" aria-live="polite"></div>
            <button class="client-carousel__control client-carousel__control--prev" type="button" aria-label="Clientes anteriores" aria-controls="clientList">
              <span class="client-carousel__arrow" aria-hidden="true"><i class="bi bi-chevron-left"></i></span>
            </button>
            <button class="client-carousel__control client-carousel__control--next" type="button" aria-label="Siguientes clientes" aria-controls="clientList">
              <span class="client-carousel__arrow" aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
            </button>
          </div>
        </section>
      </main>
    </div>
  </div>
    <script src="Javas/i18n.js"></script>
  <script src="Javas/firebase-config.js"></script>
  <script src="Javas/firebase-loader.js"></script>
  <script src="Javas/app.js"></script>
</body>
</html>
