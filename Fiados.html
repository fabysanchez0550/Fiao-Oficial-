<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fiados | Panel FIA'O</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="Style/app.css">
</head>
<body class="app" data-page="fiados">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="logo">FIA'<span class="logo__o">O</span></a>
      <nav class="side-nav" id="sideNav" aria-label="Panel"></nav>
      <div class="side-foot">
        <p id="userName"></p>
        <button class="btn btn--ghost btn--sm" id="logout" type="button">Cerrar sesión</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="app-main">
      <header class="topbar">
        <button class="burger" id="menuBtn" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar"><span></span><span></span></button>
        <h1>Fiados</h1>
        <span class="topbar__biz" id="bizName"></span>
        <button class="btn btn--pay btn--sm" id="newMov" type="button"><i class="bi bi-cash-coin" aria-hidden="true"></i> Registrar pago</button>
      </header>

      <main class="app-content">
        <section class="panel-box">
          <div class="panel-head">
            <div class="tabs__list" role="tablist" aria-label="Filtrar movimientos" style="margin:0">
              <button class="tab is-active" type="button" data-filter="todos" role="tab" aria-selected="true">Todos</button>
              <button class="tab" type="button" data-filter="fiado" role="tab" aria-selected="false">Fiados</button>
              <button class="tab" type="button" data-filter="pago" role="tab" aria-selected="false">Pagos</button>
            </div>
            <input class="search" id="movSearch" type="search" placeholder="Buscar por cliente" aria-label="Buscar por cliente">
          </div>
          <p class="muted" id="movCount"></p>
          <ul class="rows" id="movList" aria-live="polite"></ul>
        </section>
      </main>
    </div>
  </div>
    <script src="Javas/i18n.js"></script>
  <script src="Javas/firebase-config.js"></script>
  <script src="Javas/firebase-loader.js"></script>
  <script src="Javas/app.js"></script>
</body>
</html>
